name: Release

# Push an annotated tag vX.Y.Z whose message holds the release notes:
#   git tag -a v0.2.2 -F notes.md && git push origin v0.2.2
# The full CI runs first; the release is only created if it passes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish the GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The annotated tag object is needed for --notes-from-tag.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version="$(python -c 'import re, pathlib; print(re.search(r"__version__ = \"(.+?)\"", pathlib.Path("src/paperscan/__init__.py").read_text()).group(1))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
          ls -l dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "PaperScan ${VERSION}" \
            --notes-from-tag \
            --verify-tag
